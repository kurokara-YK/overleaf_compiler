<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- overleaf-compiler のアイコン。緑の角丸に白い葉。葉の付け根は、めくれる紙の端（overleaf ＝ ページをめくる）。
       Overleaf の雰囲気に寄せた独自の図柄で、Overleaf のロゴは使っていない -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cbf6b"/><stop offset="1" stop-color="#138a42"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f2e1"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <!-- 葉 -->
  <path d="M34 92 C 30 58, 54 30, 96 28 C 98 66, 76 94, 40 96 Z" fill="#ffffff"/>
  <!-- 葉脈 -->
  <path d="M40 92 C 56 74, 72 56, 90 34" fill="none" stroke="#2fa358" stroke-width="5" stroke-linecap="round"/>
  <path d="M56 74 L 50 60 M 66 63 L 63 49 M 70 64 L 82 62 M 58 76 L 72 78" fill="none" stroke="#2fa358" stroke-width="3.2" stroke-linecap="round"/>
  <!-- めくれる紙の端 -->
  <path d="M30 98 L 30 80 C 36 88, 42 92, 50 98 Z" fill="url(#fold)"/>
  <path d="M30 98 L 50 98" stroke="#138a42" stroke-width="2" stroke-linecap="round" opacity=".35"/>
</svg>
